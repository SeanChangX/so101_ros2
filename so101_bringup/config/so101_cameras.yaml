cameras:

  - name: cam_front # name of camera
    camera_type: realsense2_camera # name of pkg # Currently supports 'usb_camera' and 'realsense2_camera'
    param_path: so101_realsense2.yaml # path to camera specific config file
    namespace: follower # ns (info of cam location)
    tf_parent_frame: follower/gripper_frame_link # robot link camera is mounted on
    tf_child_frame: cam_front_depth_optical_frame # use actual frame_id from pointcloud header
    tf_xyz: [-0.0030, 0.0480, -0.0400] # meters
    tf_rpy: [-0.3229, 0.0559, 3.1416] # radians
    tf_tuner: false


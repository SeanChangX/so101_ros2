web_teleop_node:
  ros__parameters:
    http_port: 8080
    rosbridge_port: 9090

    ssl_cert: ''
    ssl_key: ''

    session_timeout: 30.0

    # Tilt below this threshold (degrees) is ignored.
    deadzone_deg: 3.0

    # Gains: ratio of joint movement per degree of phone tilt.
    # 1.0 = phone tilts 30 deg, joint moves 30 deg.
    # Negative = flip direction. Tune these to feel natural.
    gain_pan:   1.0     # alpha (yaw)  -> shoulder_pan  (base rotation)
    gain_lift:  0.6     # beta (pitch) -> shoulder_lift  (arm up/down)
    gain_elbow: 0.4     # beta (pitch) -> elbow_flex     (coupled reach)
    gain_wrist: 0.4     # beta (pitch) -> wrist_flex     (gripper angle compensation)
    gain_roll:  1.0     # gamma (roll) -> wrist_roll     (gripper roll)

    # Z axis: phone vertical acceleration -> height offset.
    # z_speed: integration rate (rad/s per unit of normalized accel input)
    # z_elbow_comp / z_wrist_comp: joint compensation for vertical motion
    z_speed: 0.5
    z_elbow_comp: 0.5
    z_wrist_comp: 0.3
